---
analyzer:
  skip_excluded: true
  package_managers:
    GradleInspector:
      options:
        # HACK: Bypass foojay Temurin JDK auto-provisioning (broken since 2026-10-06,
        # see https://github.com/foojayio/discoapi/issues/165) by downloading a
        # fixed Temurin build directly. Overrides the ai-dial-ci provided javaVersion option, so it MUST match the
        # Java toolchain version in build.gradle (the build has no toolchain resolver to provision another JDK).
        # TODO: Remove this when the foojay API is fixed
        customJdkUrl: "https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.5.1%2B2/OpenJDK25U-jdk_x64_linux_hotspot_25.0.5.1_2.tar.gz"
excludes:
  scopes:
    - pattern: "annotationProcessor"
      reason: "BUILD_DEPENDENCY_OF"
      comment: "Packages to process code annotations only."
    - pattern: "checkstyle"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages for static code analysis only."
    - pattern: "lombok"
      reason: "DEV_DEPENDENCY_OF"
      comment: "Packages from Project Lombok only."
    - pattern: "test.*"
      reason: "TEST_DEPENDENCY_OF"
      comment: "Packages for testing only."
